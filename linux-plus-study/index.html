<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linux+ Study Console</title>
<meta name="description" content="Interactive study app for the CompTIA Linux+ XK0-006 exam: plain-English lessons, real command examples, spaced-repetition flashcards, and a command matching game.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#home"><span class="prompt">$</span> linux+<span class="cursor" aria-hidden="true"></span></a>
    <nav class="nav" aria-label="Main">
      <a href="#home" data-nav="home">Dashboard</a>
      <a href="#cards" data-nav="cards">Flashcards</a>
      <a href="#match" data-nav="match">Command Match</a>
    </nav>
    <form class="search" id="search-form" role="search">
      <input id="search-input" type="search" placeholder="grep topics, commands, cards…" aria-label="Search">
    </form>
    <div class="stats">
      <span title="Daily streak">streak <b id="stat-streak">0</b></span>
      <span class="hide-sm" title="Experience points">xp <b id="stat-xp">0</b></span>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle light or dark theme">theme</button>
    </div>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<footer>
  Unofficial study aid based on the CompTIA Linux+ XK0-006 exam objectives (v5.0). Progress is saved in this browser only.
</footer>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status"></div>

<script src="data/00-core.js"></script>
<script src="data/acronyms.js"></script>
<script src="data/domain1.js"></script>
<script src="data/domain2.js"></script>
<script src="data/domain3.js"></script>
<script src="data/domain4.js"></script>
<script src="data/domain5.js"></script>
<script src="app.js"></script>
</body>
</html>
